<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HausIn Mobile</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        align-items: center;
        background: #f7f8f6;
        color: #243330;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        background: #fff;
        border: 1px solid #dfe7e4;
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(30, 111, 104, 0.1);
        max-width: 420px;
        padding: 40px 32px;
        text-align: center;
      }
      h1 {
        color: #1e6f68;
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HausIn Mobile</h1>
      <p>The new mobile workspace is being prepared.</p>
    </main>
  </body>
</html>
