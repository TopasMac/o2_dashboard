knp_snappy:
  pdf:
    enabled: true
    binary: '/usr/local/bin/wkhtmltopdf'
    options:
      enable-local-file-access: true
      print-media-type: true
      lowquality: false
      quiet: false

when@dev:
  parameters:
    env(WKHTMLTOPDF_BINARY): '/usr/local/bin/wkhtmltopdf'
  knp_snappy:
    pdf:
      binary: '%env(WKHTMLTOPDF_BINARY)%'
